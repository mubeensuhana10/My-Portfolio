<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mubeen Suhana</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo">Mubeen Suhana</div>
            <nav class="site-nav" id="site-nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="resume.html" class="nav-link">Resume</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>
            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <section class="contact-section fade-in">
        <div class="container">
            <h2 class="section-title">Contact Me</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <p><strong>Email:</strong> <a href="mailto:mubeen@example.com">mubeen@example.com</a></p>
                    <p><strong>LinkedIn:</strong> <a href="#">linkedin.com/in/mubeen-suhana</a></p>
                    <p><strong>GitHub:</strong> <a href="#">github.com/mubeen</a></p>
                </div>
                <div class="contact-form">
                    <form action="#" method="post">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>

                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>

                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Mubeen Suhana</p>
            <p>Built with ❤️ using HTML &amp; CSS</p>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
